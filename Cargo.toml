[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
    "crates/knot-composition",
]
exclude = ["crates/knot-document", "crates/knot-site"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"

rust-version = "1.97.1"

[workspace.dependencies]
curation = { package = "mere-curation", version = "0.1.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-file-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }
knot-composition = { version = "0.0.1", path = "crates/knot-composition" }
reference-data = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line. Family source convention (Mere
# family composition brief, "Family source convention", 2026-10-15): every
# first-party row names its repository by `branch = "main"` at the canonical
# URL, so there is one Cargo source for Mere, Murm, Genet and netrender here;
# Cargo.lock pins the tested revision, and a repin is `cargo update -p
# <package>` (for example `-p graphshell-host` for Mere, `-p mere-transport`
# for Murm), then this repository's checks. The per-revision pin history that
# used to live in this comment is in git: `git log -p -- Cargo.toml`.
# Mesquite owns execution and receipts; Taproot owns semantic selection and
# click delivery hooks; Apparatus owns bounded diagnostic observations.
chartulary = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
chirograph = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
eidetic = { version = "0.0.2", default-features = false, git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
esp = { version = "0.1.0", git = "https://github.com/merely-made/esp.git", rev = "6d371901435b68e3fb4099a97789222d15f87cf0" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", rev = "692674ca66728f5b0dbb2fc7e756acaa83626f5c" }
graphshell-endpoint = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
# The serving half Knot's place projection test and k2 peer serve through
# (Mere stack lift plan P4, `graphshell-host`).
graphshell-host = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
graphshell-client = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
mora-cmudict = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
muniment = { version = "0.1.2", git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pandect = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
# The identity tier left mere for merely-made/dramatis (dramatis repo plan,
# DR-D). Named by branch, like every first-party row (family source convention).
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
sceno = { version = "0.0.6", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { version = "0.0.6", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { version = "0.0.5", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", branch = "main" }
pictograph = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["canvas"] }
seiche = { version = "0.0.6", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
servitor = { version = "0.0.2", git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
stickleback = { version = "0.1.1", git = "https://github.com/merely-made/eidetic.git", rev = "34105d63ec17826e0a58a5b461b65150357dd000" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }

# Presentation stack. The platform boundary move put Cambium, Illume, Inker,
# Nematic and the Knot editor host in Mere; the raw engine contracts stay in
# Genet. Keep every source on the same immutable revision per repository as the
# Mere and Turnstone consumers.
tabard = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium = { version = "0.4.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
mere-view = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
# A resident mere's route read as an overmap layer above Knot's catalog graph
# (knot-editor `mere_overlay`, Mark's ruling 2026-10-15).
mere-overmap = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", branch = "main" }
sprigging = { version = "0.2.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
workbench = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
backstep = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
inker = { git = "https://github.com/merely-made/mere.git", branch = "main" }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
nematic = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
percent-encoding = "2"
mora = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

