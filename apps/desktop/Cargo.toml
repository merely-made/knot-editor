[package]
name = "knot-desktop"
version = "0.0.1"
edition = "2024"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "knot"
path = "src/main.rs"

[[example]]
name = "collection_acceptance"
required-features = ["mere-retention"]

[dependencies]
edit-history.workspace = true
scenomise.workspace = true
scenograph.workspace = true
sceno.workspace = true
apparatus = { package = "mere-apparatus", git = "https://github.com/merely-made/mere.git", rev = "227062a92e0698621c488251590dba3437d780e7", default-features = false, features = ["serde"] }
taproot.workspace = true
mesquite.workspace = true
knot-site = { path = "../../crates/knot-site" }
inker.workspace = true
nematic.workspace = true

knot-editor = { path = "../../crates/knot-editor", optional = true }
personae = { workspace = true, optional = true }
knot-capture.workspace = true
cambium.workspace = true
cambium-genet-winit-host.workspace = true
mere-view.workspace = true
sprigging.workspace = true
workbench.workspace = true
knot-document = { workspace = true, features = ["highlight", "engine"] }
tinct = { version = "0.1.2", git = "https://github.com/merely-made/mere.git", rev = "227062a92e0698621c488251590dba3437d780e7" }
knot-file-catalog.workspace = true
knot-readings.workspace = true
knot-composition.workspace = true
reference-data.workspace = true
blake3.workspace = true
percent-encoding.workspace = true
layout-dom-api.workspace = true
genet-scripted-dom.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints]
workspace = true

[features]
default = ["mere-retention"]
mere-retention = ["dep:knot-editor", "dep:personae"]
resident-retention-tests = ["dep:knot-editor", "dep:personae"]
retinue = ["knot-site/retinue"]
