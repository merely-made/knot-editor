[package]
name = "knot-desktop"
version = "0.0.1"
edition = "2024"

rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "knot"
path = "src/main.rs"

[[example]]
name = "collection_acceptance"
required-features = ["mere-retention"]

[dependencies]
curation.workspace = true
backstep.workspace = true
scenomise.workspace = true
scenograph.workspace = true
sceno.workspace = true
pictograph.workspace = true
seiche.workspace = true
apparatus-core = { version = "0.1.0", git = "https://github.com/merely-made/armillary.git", rev = "06340b08327b29c3485ecb0089bb5cafed20fd80", default-features = false, features = ["serde"] }
taproot.workspace = true
mesquite.workspace = true
knot-site = { path = "../../crates/knot-site", features = ["history"] }
muniment = { workspace = true, features = ["directory"] }
inker.workspace = true
nematic.workspace = true

knot-editor = { path = "../../crates/knot-editor", optional = true }
personae = { workspace = true, optional = true }
knot-capture.workspace = true
cambium = { workspace = true, features = ["highlight"] }
tabard.workspace = true
tabard-workshop.workspace = true
cambium-rootstock.workspace = true
directories = "6"
cambium-desktop.workspace = true
mere-view.workspace = true
sprigging.workspace = true
workbench.workspace = true
platen.workspace = true
kernel.workspace = true
knot-document = { workspace = true, features = ["highlight", "engine"] }
tinct = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
knot-catalog.workspace = true
knot-readings = { workspace = true, features = ["portable-scenes"] }
knot-composition.workspace = true
reference-data.workspace = true
blake3.workspace = true
percent-encoding.workspace = true
layout-dom-api.workspace = true
genet-scripted-dom.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
pollster = "0.4"
tempfile = "3"

[lints]
workspace = true

[features]
default = ["mere-retention"]
mere-retention = ["dep:knot-editor", "dep:personae", "knot-editor/mere-overlay"]
resident-retention-tests = ["dep:knot-editor", "dep:personae"]
retinue = ["knot-site/retinue"]
