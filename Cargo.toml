[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
]
exclude = ["crates/knot-document", "crates/knot-site"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
rust-version = "1.97"

[workspace.dependencies]
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-file-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line; Knot moved to 9ad5990b on
# 2026-09-23 for Cambium's scenario lane, status bar and tab marks
# (workspace slice 1), to 5364dfa0 on 2026-09-24 for insigne phase A, to
# b0e29383 the same day for Cambium's popover and text field caret and the
# Genet fixes under them (slice 1 step 3c), to aeeb5bc7 on 2026-09-25 for
# the Genet fix under the reading tiles (step 4a), to 0d341dee the same day
# for Cambium's fold gutter and the Genet fix under it (step 4b), to
# 6a206411 the same day for the host's vertical caret follow (step 5), to
# 9a2e4eeb the same day for the harness's click scroll through every plane,
# the flex popover anchor, and Genet's flex minimum and CSS 2.1 line boxes
# (step 5), to e3d7061d the same day for one scroll walk shared with caret
# follow and Genet's atom baselines, to 149b8053 on 2026-09-26 for the status
# bar's one-click chip switch and Genet's text field names (step 5c), to
# 37b0bced the same day for status chips that stay whole beside a long
# message, and to 0418391f the same day with Genet 0cf4f30, which forwards
# netrender's optional features, and insigne's checked certificates, while
# Turnstone stayed on 250fd238, so the lines diverge until Turnstone is
# repinned.
# The presentation follow-up pinned Mere ac1a5e5d on the 8fce5365 base for
# empty Graph session sizing and visible-textbox scenario focus. The shared
# combined diagnostics/Commands/font integration pins Mere bd5912fb and Genet
# 69a2383b, retaining
# those fixes alongside the computed-semantic selector and text-boundary work.
# Mesquite owns execution and receipts; Taproot owns semantic selection and
# click delivery hooks; Apparatus owns bounded diagnostic observations.
chartulary = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
chirograph = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
eidetic = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a", default-features = false }
esp = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
graphshell-endpoint = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
mora-cmudict = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
muniment = { version = "0.1.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
notochord = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
pandect = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
insigne = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a", features = ["verify"] }
personae = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
sceno = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
scenotime = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
servitor = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
stickleback = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }

# Presentation stack. The platform boundary move put Cambium, Illume, Inker,
# Nematic and the Knot editor host in Mere; the raw engine contracts stay in
# Genet. Keep every source on the same immutable revision per repository as the
# Mere and Turnstone consumers.
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
mere-view = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
sprigging = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
workbench = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
inker = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a", default-features = false }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
percent-encoding = "2"
mora = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
# Stable Burn runtime policy, matching the Mere family above.
cubecl-runtime = { git = "https://github.com/merely-made/mere.git", rev = "564f04797097fa390a16e82e89288fdfdf5bdb7a" }
gemini-protocol = { git = "https://github.com/merely-made/smolweb.git", rev = "882baeb1b59bbdbb305e475f6675f69af997c4f4" }
# Root patches are not inherited from Genet or Mere. These keep the standalone
# workspace on the same type families as both upstream repositories.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "69a2383b2ad777b884a72f31f8f8fb7ece275c0b" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.
# `mere-p2panda-net` resolves from the matching immutable source tag until its
# crates.io release is available.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
swarm-discovery = { git = "https://github.com/mark-ik/swarm-discovery.git", branch = "mere", version = "=0.6.3" }
