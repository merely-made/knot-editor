[package]
name = "knot-sync"
version = "0.0.1"
edition.workspace = true

rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
description = "Knot's sync grammar, fold and operation store over Stickleback, with no graph or host crate."

[features]
default = []
# `KnotSyncStore::join`: the real LogSync lane over murm-sync.
peers = ["dep:murm-sync"]
# `open_through_reservoir`: open the notes mere through catchment's store.
reservoir = ["dep:catchment", "dep:personae", "dep:pollster"]

[dependencies]
blake3.workspace = true
catchment = { workspace = true, features = ["store"], optional = true }
jotdown = "0.10"
knot-catalog.workspace = true
muniment = { workspace = true, features = ["redb"] }
murm-sync = { workspace = true, optional = true }
p2panda-core = { package = "p2mere-core", version = "0.11" }
p2panda-store = { package = "p2mere-store", version = "0.11", default-features = false }
personae = { workspace = true, optional = true }
pollster = { version = "1", optional = true }
proofs.workspace = true
sceno-backdrops.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
similar = "2.7"
stickleback.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
personae.workspace = true
pollster = "1"
tempfile = "3"
transport = { workspace = true, features = ["test-identity"] }

[lints]
workspace = true
