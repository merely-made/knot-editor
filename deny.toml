# cargo-deny configuration for knot-editor.
#
#   cargo deny --workspace --all-features check -D unmatched-skip bans
#
# The hook runs that here and in each nested workspace that ships, each against
# its own deny.toml: crates/knot-document (Knot's document surface, a path
# dependency of knot-editor kept as its own workspace) and crates/mora (the
# published prosody engine, its own no_std/MSRV workspace). A skip that matches
# nothing fails. No tracked workspace is exempt.
#
# Duplicates are denied (Mark, 2026-11-12: "no duplicates. latest releases or an
# argument why"; 2026-11-13: "One version, latest version, no duplicates,
# unafraid to patch or fork if needed"). Two versions of one crate in a build
# are a defect: move the older version's holder forward. Each skip below is a
# duplicate that cannot be removed from here yet, naming the holder that keeps
# it ("latest" when that holder is at its newest release, "drops it" when a
# newer release of the holder already would, "family" for a family crate
# updated in its own repository), the path it arrives by, and what removes it.
# A holder that is our own manifest is updated, not skipped; a skip is a
# stopgap, never an end state.

[graph]
all-features = true

[bans]
multiple-versions = "deny"
wildcards = "allow"

