[workspace]

[package]
name = "knot-site"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
description = "Native small-web site files and explicit loopback publication for Knot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scroll-protocol = { version = "=0.1.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13.2"
url = "2"
language-tags = "0.3"
time = { version = "0.3", features = ["parsing"] }

gemini-protocol = { version = "=0.1.7", features = ["server"] }
spartan-protocol = "=0.1.1"
tokio = { version = "1", features = ["rt", "sync", "net", "time", "macros"] }
blake3 = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[patch.crates-io]
gemini-protocol = { git = "https://github.com/merely-made/smolweb.git", rev = "882baeb1b59bbdbb305e475f6675f69af997c4f4" }
