[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
]
exclude = ["crates/knot-document", "crates/knot-site"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
rust-version = "1.97"

[workspace.dependencies]
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-file-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line; Knot moved to 9ad5990b on
# 2026-09-23 for Cambium's scenario lane, status bar and tab marks
# (workspace slice 1), to 5364dfa0 on 2026-09-24 for insigne phase A, and
# to bbd19bb3 the same day for Cambium's popover and text field caret and
# the Genet fixes under them (slice 1 step 3c), while Turnstone stayed on
# 250fd238, so the lines diverge until Turnstone is repinned.
chartulary = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
chirograph = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
eidetic = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0", default-features = false }
esp = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
graphshell-endpoint = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
mora-cmudict = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
muniment = { version = "0.1.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
notochord = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
pandect = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
personae = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
sceno = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
scenotime = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
servitor = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
stickleback = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }

# Presentation stack. The platform boundary move put Cambium, Illume, Inker,
# Nematic and the Knot editor host in Mere; the raw engine contracts stay in
# Genet. Keep every source on the same immutable revision per repository as the
# Mere and Turnstone consumers.
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
workbench = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
inker = { git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0" }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0", default-features = false }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "bbd19bb36ce28033f3d593bd327ea6ea6f9080b0", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
mora = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
gemini-protocol = { git = "https://github.com/merely-made/smolweb.git", rev = "882baeb1b59bbdbb305e475f6675f69af997c4f4" }
# Root patches are not inherited from Genet or Mere. These keep the standalone
# workspace on the same type families as both upstream repositories.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "16ca28adda3b1d6927a1a3e878e61325219e24db" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.
# `mere-p2panda-net` resolves from the matching immutable source tag until its
# crates.io release is available.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.4" }
swarm-discovery = { git = "https://github.com/mark-ik/swarm-discovery.git", branch = "mere", version = "=0.6.3" }
