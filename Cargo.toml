[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
    "crates/knot-composition",
    "crates/mora-cmudict",
    "crates/reference-data",
]
exclude = ["crates/knot-document", "crates/mora"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"

rust-version = "1.97.1"

[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }
curation = { package = "mere-curation", version = "0.1.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }
knot-composition = { version = "0.0.1", path = "crates/knot-composition" }
reference-data = { version = "0.0.1", path = "crates/reference-data" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line. Family source convention (Mere
# family composition brief, "Family source convention", 2026-10-15): every
# first-party row names its repository by `branch = "main"` at the canonical
# URL, so there is one Cargo source for Mere, Murm, Genet and netrender here;
# Cargo.lock pins the tested revision, and a repin is `cargo update -p
# <package>` (for example `-p graphshell-host` for Mere, `-p mere-transport`
# for Murm), then this repository's checks. The per-revision pin history that
# used to live in this comment is in git: `git log -p -- Cargo.toml`.
# Mesquite owns execution and receipts; Taproot owns semantic selection and
# click delivery hooks; Apparatus owns bounded diagnostic observations.
chartulary = { version = "0.3.0", git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
chirograph = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", branch = "main" }
eidetic = { version = "0.0.3", default-features = false, git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
esp = { version = "0.1.0", git = "https://www.github.com/merely-made/distillery.git", rev = "27fd59188c5036627aec0f85feaa59907c7ba53f" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
gemot = { version = "0.1.1", git = "https://www.github.com/merely-made/gemot.git", rev = "bcfd40831253734d3e7ef954190d4d37e8fbaea2" }
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", rev = "08ebbc44f5d391bd263fcc26b6053edf72741954" }
castellan-client = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
graphshell-endpoint = { version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
# The serving half Knot's place projection test and k2 peer serve through
# (Mere stack lift plan P4, `graphshell-host`).
graphshell-host = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
graphshell-client = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
mora-cmudict = { version = "0.0.1", path = "crates/mora-cmudict" }
muniment = { version = "0.2.1", git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
pandect = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
# The identity tier left mere for merely-made/dramatis (dramatis repo plan,
# DR-D). Named by branch, like every first-party row (family source convention).
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
sceno = { version = "0.0.7", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenomise = { version = "0.0.7", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenograph = { version = "0.0.6", git = "https://github.com/merely-made/mere.git", branch = "main" }
scenotime = { version = "0.0.5", git = "https://github.com/merely-made/mere.git", branch = "main" }
pictograph = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["canvas"] }
seiche = { version = "0.0.6", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["serde"] }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
servitor = { version = "0.0.3", git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
stickleback = { version = "0.2.0", default-features = false, git = "https://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }

# Presentation stack. The platform boundary move put Cambium, Illume, Inker,
# Nematic and the Knot editor host in Mere; the raw engine contracts stay in
# Genet. Keep every source on the same immutable revision per repository as the
# Mere and Turnstone consumers.
tabard = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-rootstock = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium = { version = "0.6.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
mere-view = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
# A resident mere's route read as an overmap layer above Knot's catalog graph
# (knot-editor `mere_overlay`, Mark's ruling 2026-10-15).
mere-overmap = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
mesquite = { git = "https://github.com/merely-made/mere.git", branch = "main" }
cambium-desktop = { git = "https://github.com/merely-made/mere.git", branch = "main" }
sprigging = { version = "0.3.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
workbench = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
platen = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, features = ["workspace-editor"] }
kernel = { package = "mere-kernel", version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
backstep = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
inker = { git = "https://github.com/merely-made/mere.git", branch = "main" }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
nematic = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
percent-encoding = "2"
mora = { version = "0.1.0", path = "crates/mora" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
# Registry Webcue and native Genet sessions share one canonical input vocabulary,
# as in mere's root, whose patches do not carry across a git dependency.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Mere's patched AccessKit (support/patches/accesskit): mere's cambium hosts call
# methods only the patched copy has, so the same copy, from mere at this lock.
accesskit = { git = "https://github.com/merely-made/mere.git", branch = "main" }
# Canonical promoted families; keep registry and Git consumers type-identical.
eidetic = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
muniment = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", rev = "897fb963d184f0e379ab9041d68e17e726cb7763" }

# The http form of the www URL is a third source key: Mere and Dramatis still name
# eidetic, murm and distillery through the https forms, so both patch to it.
[patch."https://www.github.com/merely-made/eidetic.git"]
chartulary = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
eidetic = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
luggage = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
mere-proofs = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
muniment = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
servitor = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }
stickleback = { git = "http://www.github.com/merely-made/eidetic.git", rev = "5182e4e244c85b1008182a1be6b822f65a8efe50" }

[patch."https://github.com/merely-made/armillary.git"]
armillary = { git = "https://www.github.com/merely-made/armillary.git", rev = "864f107d44bf759111ad2ea3c9036b2cfbf03f4c" }
apparatus-core = { git = "https://www.github.com/merely-made/armillary.git", rev = "06340b08327b29c3485ecb0089bb5cafed20fd80" }

# Keep published custody clients on the host's door types.
[patch.crates-io.ostiary]
version = "0.0.1"
git = "https://github.com/merely-made/armillary.git"
rev = "08ebbc44f5d391bd263fcc26b6053edf72741954"

[patch."https://github.com/merely-made/murm.git".murm-wire]
git = "http://www.github.com/merely-made/murm.git"
rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7"

[patch."https://www.github.com/merely-made/murm.git"]
mere-transport = { git = "http://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }
murm-sync = { git = "http://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }
murm-webrtc = { git = "http://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }
retinue = { git = "http://www.github.com/merely-made/murm.git", rev = "0aaf4b16d3d265a7d0af09f083d622284f5846d7" }

[patch."https://www.github.com/merely-made/distillery.git"]
esp = { git = "http://www.github.com/merely-made/distillery.git", rev = "27fd59188c5036627aec0f85feaa59907c7ba53f" }
