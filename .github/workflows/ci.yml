name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go-launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Test external page-server launcher
        working-directory: tools/knot-nomadnet-go
        run: go test ./...
  site-backends:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        backend: [none, retinue]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Test backend-independent publication
        if: matrix.backend == 'none'
        run: cargo test --manifest-path crates/knot-site/Cargo.toml --no-default-features
      - name: Verify publication does not pull in Retinue
        if: matrix.backend == 'none'
        run: |
          cargo tree --manifest-path crates/knot-site/Cargo.toml --no-default-features -e normal --prefix none > site-dependencies.txt
          if grep -q '^retinue ' site-dependencies.txt; then
            cat site-dependencies.txt
            exit 1
          fi
      - name: Test optional Retinue backend
        if: matrix.backend == 'retinue'
        run: cargo test --manifest-path crates/knot-site/Cargo.toml --no-default-features --features retinue
  test:
    runs-on: windows-latest
    env:
      # Genet retains WPT/Test262 paths that exceed Win32's legacy path limit.
      # Use Git's long-path-aware checkout instead of Cargo's libgit2 fetcher.
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_HOME: C:\cargo
    steps:
      - uses: actions/checkout@v4
      - name: Enable long Git paths
        run: git config --global core.longpaths true
      - name: Install Rust toolchain
        run: rustup show
      - name: Test document surface
        run: cargo test --manifest-path crates/knot-document/Cargo.toml
      - name: Test editor library
        run: cargo test -p knot-editor --lib
      - name: Test desktop host receipt
        run: cargo test -p knot-desktop
      - name: Check optional desktop Retinue backend
        run: cargo check -p knot-desktop --features retinue
