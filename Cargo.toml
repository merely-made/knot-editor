[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
    "crates/knot-sync",
    "crates/knot-composition",
    "crates/mora-cmudict",
    "crates/reference-data",
]
exclude = ["crates/knot-document", "crates/mora"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"

rust-version = "1.97.1"

[workspace.dependencies]
murm-sync = { version = "0.0.1", git = "https://github.com/merely-made/murm.git", branch = "main" }
incipit = { version = "0.2.2", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }
knot-composition = { version = "0.0.1", path = "crates/knot-composition" }
reference-data = { version = "0.0.1", path = "crates/reference-data" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line. Family source convention (Mere
# family composition brief, "Family source convention", 2026-10-15): every
# first-party row names its repository by `branch = "main"` at the canonical
# URL, so there is one Cargo source for Mere, Murm, Genet and netrender here;
# Cargo.lock pins the tested revision, and a repin is `cargo update -p
# <package>` (for example `-p graphshell-host` for Mere, `-p mere-transport`
# for Murm), then this repository's checks. The per-revision pin history that
# used to live in this comment is in git: `git log -p -- Cargo.toml`.
# Mesquite owns execution and receipts; Taproot owns semantic selection and
# click delivery hooks; Apparatus owns bounded diagnostic observations.
chartulary = { version = "0.3.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
chirograph = { version = "0.0.5", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
eidetic = { version = "0.0.3", default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }
esp = { version = "0.1.0", git = "https://github.com/merely-made/distillery.git", branch = "main" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/gemot.git", branch = "main" }
ostiary = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
castellan-client = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
dramatis = { git = "https://github.com/merely-made/dramatis.git", branch = "main" }
graphshell-endpoint = { version = "0.0.4", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-door = { version = "0.0.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# The serving half Knot's place projection test and k2 peer serve through
# (Mere stack lift plan P4, `graphshell-host`).
graphshell-host = { version = "0.0.2", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false }
graphshell-client = { version = "0.0.2", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mora-cmudict = { version = "0.0.1", path = "crates/mora-cmudict" }
muniment = { version = "0.2.1", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
notochord = { version = "0.1.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
catchment = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
knot-sync = { version = "0.0.1", path = "crates/knot-sync" }
pandect = { version = "0.2.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
sporran = { version = "0.0.1", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
insigne = { version = "0.0.2", git = "https://github.com/merely-made/dramatis.git", branch = "main", features = ["verify"] }
# The identity tier left mere for merely-made/dramatis (dramatis repo plan,
# DR-D). Named by branch, like every first-party row (family source convention).
personae = { version = "0.3.0", git = "https://github.com/merely-made/dramatis.git", branch = "main" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
sceno = { version = "0.0.7", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# Backdrop scenes and sequence templates left `scenomise` for Graphshell (Mere cycle-breaks D17).
sceno-backdrops = { version = "0.0.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenomise = { version = "0.0.7", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenograph = { version = "0.0.6", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { version = "0.0.5", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cartography = { package = "mere-cartography", version = "0.0.2", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["canvas", "physics-engine"] }
seiche = { version = "0.0.6", git = "https://github.com/merely-made/seiche.git", branch = "main", default-features = false, features = ["serde"] }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/inker.git", branch = "main" }
servitor = { version = "0.0.3", git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { version = "0.2.0", default-features = false, git = "https://github.com/merely-made/eidetic.git", branch = "main" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/murm.git", branch = "main" }

# Presentation stack. Cambium is in Mere; Illume, Inker, Nematic and
# script-rhai left Mere for merely-made/inker (Mere engine split plan, P1), and
# the retained Knot editor lives in knot-document (D17); the raw engine
# contracts stay in Genet. Keep every source on the same immutable revision per
# repository as the Mere and Turnstone consumers.
tabard = { version = "0.0.2", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
tabard-workshop = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium-rootstock = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium = { version = "0.6.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mere-view = { version = "0.1.0", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
# A resident mere's route read as an overmap layer above Knot's catalog graph
# (knot-editor `mere_overlay`, Mark's ruling 2026-10-15).
mere-overmap = { version = "0.1.0", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
mandrake = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
cambium-desktop = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
sprigging = { version = "0.3.0", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
workbench = { version = "0.1.1", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
platen = { version = "0.0.1", git = "https://github.com/merely-made/graphshell.git", branch = "main", default-features = false, features = ["workspace-editor"] }
kernel = { package = "mere-kernel", version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main" }
backstep = { version = "0.2.0", git = "https://github.com/merely-made/graphshell.git", branch = "main" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { version = "0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/inker.git", branch = "main" }
inker = { git = "https://github.com/merely-made/inker.git", branch = "main" }
layout-dom-api = { version = "0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
nematic = { git = "https://github.com/merely-made/inker.git", branch = "main", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
percent-encoding = "2"
mora = { version = "0.1.0", path = "crates/mora" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
# Registry Webcue and native Genet sessions share one canonical input vocabulary,
# as in mere's root, whose patches do not carry across a git dependency.
document-session-api = { git = "https://github.com/merely-made/genet.git", branch = "main" }
# Webcue comes from its repository, as in Mere's root, so the lock holds one copy and one document-session-api.
webcue = { git = "https://github.com/merely-made/wgpu-cue.git", branch = "main" }
# Canonical promoted families; keep registry and Git consumers type-identical.
eidetic = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
muniment = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
scroll-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
spartan-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
gemini-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }

# The http form of the www URL is a third source key: Mere and Dramatis still name
# eidetic, murm and distillery through the https forms, so both patch to it.
# Keep published custody clients on the host's door types.
# The rest of Mere's root patch table that names a git source, so the registry
# versions its crates name resolve to the one source (patches do not carry across
# a git dependency).
sceno = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
scenotime = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
graphshell-endpoint = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
chirograph = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
hest = { git = "https://github.com/merely-made/graphshell.git", branch = "main" }
peer-facts = { version = "0.0.1", git = "https://github.com/merely-made/armillary.git", branch = "main" }
chartulary = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
errand = { git = "https://github.com/merely-made/errand.git", branch = "main" }
esp = { git = "https://github.com/merely-made/distillery.git", branch = "main" }
finger-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
gemot = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
gopher-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
guppy-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
luggage = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mere-proofs = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
mien = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
misfin = { git = "https://github.com/merely-made/errand.git", branch = "main" }
mooting = { git = "https://github.com/merely-made/gemot.git", branch = "main" }
nex-protocol = { git = "https://github.com/merely-made/errand.git", branch = "main" }
servitor = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
stickleback = { git = "https://github.com/merely-made/eidetic.git", branch = "main" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.1" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main", version = "0.1.2" }

[patch.crates-io.ostiary]
version = "0.0.1"
git = "https://github.com/merely-made/armillary.git"
branch = "main"

# Mere names netrender through the www URL at a revision; Genet names it through
# the canonical URL. One source for both.

