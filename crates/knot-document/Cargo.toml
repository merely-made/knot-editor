[workspace]
resolver = "2"

[package]
name = "knot-document"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
highlight = ["cambium/highlight"]
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
same-file = "1.0.6"
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85" }
mere-surface-api = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85", optional = true }
inker = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85", optional = true }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85", default-features = false }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "1009f02de21d70712b75934933ce8c82503b6f85", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
genet-scripted-dom = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
genet-scripted-dom = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "7baa554c66f966295ee945d908738b635afe136a" }
