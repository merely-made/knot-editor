[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/knot-capture",
    "crates/knot-file-catalog",
    "crates/knot-editor",
    "crates/knot-readings",
    "crates/knot-composition",
]
exclude = ["crates/knot-document", "crates/knot-site"]
default-members = [
    "crates/knot-editor",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
rust-version = "1.97"

[workspace.dependencies]
# Product crates.
knot-capture = { version = "0.0.1", path = "crates/knot-capture" }
knot-document = { version = "0.0.1", path = "crates/knot-document" }
knot-file-catalog = { version = "0.0.1", path = "crates/knot-file-catalog" }
knot-readings = { version = "0.0.1", path = "crates/knot-readings" }
knot-composition = { version = "0.0.1", path = "crates/knot-composition" }
reference-data = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }

# Mere contracts and services. Embedded Knot types need one Cargo source
# identity with the Turnstone consumer line; Knot moved to 9ad5990b on
# 2026-09-23 for Cambium's scenario lane, status bar and tab marks
# (workspace slice 1), to 5364dfa0 on 2026-09-24 for insigne phase A, to
# b0e29383 the same day for Cambium's popover and text field caret and the
# Genet fixes under them (slice 1 step 3c), to aeeb5bc7 on 2026-09-25 for
# the Genet fix under the reading tiles (step 4a), to 0d341dee the same day
# for Cambium's fold gutter and the Genet fix under it (step 4b), to
# 6a206411 the same day for the host's vertical caret follow (step 5), to
# 9a2e4eeb the same day for the harness's click scroll through every plane,
# the flex popover anchor, and Genet's flex minimum and CSS 2.1 line boxes
# (step 5), to e3d7061d the same day for one scroll walk shared with caret
# follow and Genet's atom baselines, to 149b8053 on 2026-09-26 for the status
# bar's one-click chip switch and Genet's text field names (step 5c), to
# 37b0bced the same day for status chips that stay whole beside a long
# message, and to 0418391f the same day with Genet 0cf4f30, which forwards
# netrender's optional features, and insigne's checked certificates, while
# Turnstone stayed on 250fd238, so the lines diverge until Turnstone is
# repinned.
# The presentation follow-up pinned Mere ac1a5e5d on the 8fce5365 base for
# empty Graph session sizing and visible-textbox scenario focus. The shared
# combined diagnostics/Commands/font/Collapse integration used Mere c6707958
# and Genet b1eb3af1. Composition adds reference-data at Mere 9310518b without
# changing those UI crates or the Genet pin, retaining the computed-semantic
# selector and text-boundary fixes. On 2026-10-04 the mere-p2panda-net 0.7.5
# repin moved every Mere row to 031b3dcc and Genet to its bd3e8861.
# On 2026-10-05 shared relationship recipes uniformly advance Mere to
# c79bb8c2; Genet remains on bd3e8861. No local source overrides are needed.
# Then e4cf739 coherently adopts Mere 5011e2f9 in the workspace, app and
# standalone document declarations, for the shared horizontal reveal; Genet
# remains bd3e8861.
# Later on 2026-10-05 every Mere row moves to 07db35e2, which descends from
# 5011e2f9: Mere's Burn/CubeCL pre.4 promotion (merged at cec0b3a4), under
# Isometry wing ruling 557 ("Promote, then handoffs"), Knot's repin first.
# ESP uses stable Burn 0.22.0; Genet stays on bd3e8861. The root patch
# table uses stable cubecl-runtime from the ESP revision, mirroring ruling 375.
# On 2026-10-05 every Mere row, cubecl-runtime included, moves to 19e6dc9f for
# stack seams P1: relationship recipes compile through a ProjectionCompiler
# built from the card Knot measures from its own font (ruling S20; Mere burn
# plan 13.46).
# On 2026-10-06 ESP and cubecl-runtime move to 5fecd707 for stable Burn;
# the presentation and recipe dependencies retain the P1 revision.
# Mesquite owns execution and receipts; Taproot owns semantic selection and
# click delivery hooks; Apparatus owns bounded diagnostic observations.
chartulary = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
chirograph = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
eidetic = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d", default-features = false }
esp = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "5fecd707c6bc9022f952c6d7b99d59f0f568d8e8" }
fetch = { package = "mere-fetch", version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
gemot = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
graphshell = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
graphshell-endpoint = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
mora-cmudict = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
muniment = { version = "0.1.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
notochord = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
pandect = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
insigne = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d", features = ["verify"] }
personae = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
proofs = { package = "mere-proofs", version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
sceno = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
scenomise = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
scenograph = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
scenotime = { version = "0.0.4", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
script-rhai = { version = "0.0.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
servitor = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
stickleback = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
transport = { package = "mere-transport", version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }

# Presentation stack. The platform boundary move put Cambium, Illume, Inker,
# Nematic and the Knot editor host in Mere; the raw engine contracts stay in
# Genet. Keep every source on the same immutable revision per repository as the
# Mere and Turnstone consumers.
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
mere-view = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
mesquite = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
cambium-genet-winit-host = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
sprigging = { version = "0.2.1", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
workbench = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
fleece = { version = "0.5.0", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
genet-host-api = { git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
inker = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d" }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d", default-features = false }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "19e6dc9f35823897e9b1dda6d0c9b2a4615eca8d", default-features = false }
taproot = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }

# Shared registry dependencies.
base64 = "0.22"
blake3 = "1"
percent-encoding = "2"
mora = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
gemini-protocol = { git = "https://github.com/merely-made/smolweb.git", rev = "882baeb1b59bbdbb305e475f6675f69af997c4f4" }
# Root patches are not inherited from Genet or Mere. These keep the standalone
# workspace on the same type families as both upstream repositories.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "bd3e8861b2932d62b73c9936ac3a317f1df3ffdb" }
# Mere's ruling 375 runtime patch, from Mere's own tree: CubeCL persistence off
# by default, so no Turso or SQLite enters Burn's graph. This row moves with
# ESP's Mere revision at every inference repin.
cubecl-runtime = { git = "https://github.com/merely-made/mere.git", rev = "5fecd707c6bc9022f952c6d7b99d59f0f568d8e8" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.
# `mere-p2panda-net` resolves from the matching immutable source tag until its
# crates.io release is available.
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5" }
swarm-discovery = { git = "https://github.com/mark-ik/swarm-discovery.git", branch = "mere", version = "=0.6.3" }
