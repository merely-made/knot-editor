[workspace]
resolver = "2"

[package]
name = "knot-document"
version = "0.0.1"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
highlight = ["cambium/highlight"]
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
same-file = "1.0.6"
cambium = { version = "0.3.3", git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
mere-surface-api = { version = "0.1.0", git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
illume = { version = "0.0.2", git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920", optional = true }
inker = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920", optional = true }
knot-editor-host = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920", default-features = false }
nematic = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[patch.crates-io]
mere-p2panda-net = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-auth = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-core = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-discovery = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-encryption = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-store = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-stream = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
p2panda-sync = { git = "https://github.com/mark-ik/p2panda.git", tag = "mere-p2panda-net-0.7.5-upstream-20261013" }
muniment = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
mere-proofs = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
netrender_device = { git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "ae3d9f5d9721fc6b0d5faa58bb6798ee63307be1" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]
cambium = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
illume = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
inker = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
knot-editor-host = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
mere-surface-api = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
nematic = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
sceno = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
command-menu = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
edit-history = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
errand = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
meristem = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
sprigging = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
tinct = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }
workbench = { git = "https://www.github.com/merely-made/mere.git", rev = "7160353160b6befcd92b2e86d2282c16cf91f920" }

# Mere's netrender bridge, repeated because root patches are not inherited:
# Genet names netrender through the plain GitHub URL, Mere's crates through
# the www alias at f4f9c0d8, and this redirects the first to the second so the
# renderer family has one source identity (Mere 19573b51, 2026-10-15).
[patch."https://github.com/merely-made/netrender.git"]
netrender = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
netrender_device = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
paint_list_api = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
paint_list_render = { version = "=0.1.2", git = "https://www.github.com/merely-made/netrender.git", rev = "f4f9c0d87e6a6030b61075a45118055dfe6a12df" }
