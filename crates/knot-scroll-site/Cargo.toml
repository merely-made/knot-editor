[workspace]

[package]
name = "knot-scroll-site"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
description = "Native Scroll site files and explicit loopback publication for Knot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scroll-protocol = { version = "=0.1.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13.2"
url = "2"
language-tags = "0.3"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
