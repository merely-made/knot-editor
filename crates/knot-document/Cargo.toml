[workspace]
resolver = "2"

[package]
name = "knot-document"
version = "0.0.1"
edition = "2024"

rust-version = "1.97.1"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
highlight = ["cambium/highlight"]
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
# Exact published contract intake preserves Knot's qualified rendering family.
# Canonical Git source; no local patch or other supplier repin.
mere-edit = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
same-file = "1.0.6"
# The embedded surface uses the widget API shared by the 0.4 through 0.6 cohorts.
# It implements neither of the contributed-observation callbacks changed in 0.6.
cambium = { version = ">=0.4.0, <0.7.0", git = "https://github.com/merely-made/mere.git", branch = "main" }
mere-surface-api = { version = "0.1.1", git = "https://github.com/merely-made/mere.git", branch = "main" }
illume = { version = "0.0.3", git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
inker = { git = "https://github.com/merely-made/mere.git", branch = "main", optional = true }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false }
nematic = { git = "https://github.com/merely-made/mere.git", branch = "main", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch.crates-io]
# Canonical promoted families; keep registry and Git consumers type-identical.
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
hagiograph = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
vello_shaders = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
netrender-vello = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
vello_encoding = { git = "https://github.com/mark-ik/vello", rev = "276b46648c08f3d2062e70559afa999842e1873c" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", branch = "main" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", branch = "main" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.

[workspace.package]
rust-version = "1.97.1"

# Root patches are not inherited from the imported Murm suppliers.
[patch."https://github.com/merely-made/mere.git"]

# Suppliers that still name eidetic aa94fe22 (Gemot, Murm, Mere at its locked
# revision) resolve to this revision through the www form of the URL, the same
# repository under another source key, so one eidetic resolves. Drop once they
# repin.
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }

[patch."https://github.com/merely-made/eidetic.git"]
chartulary = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
eidetic = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
luggage = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
mere-proofs = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
muniment = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
servitor = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }
stickleback = { git = "https://www.github.com/merely-made/eidetic.git", rev = "98f2c6977d7210d2149b80ee8be0b3e0f724d44b" }

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
too_many_lines = "warn"

[patch."https://github.com/merely-made/distillery.git"]
esp = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }
esp-testkit = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }
distillery = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }
mere-mesh = { git = "https://www.github.com/merely-made/distillery.git", rev = "01268ae2373859489284a00f1447699fadb9442f" }
