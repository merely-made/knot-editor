[workspace]
resolver = "2"

[package]
name = "knot-document"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
highlight = ["cambium/highlight"]
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
same-file = "1.0.6"
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425" }
mere-surface-api = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425", optional = true }
inker = { git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425", optional = true }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425", default-features = false }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[patch.crates-io]
# Match the stable inference runtime policy of the parent workspace.
cubecl-runtime = { git = "https://github.com/merely-made/mere.git", rev = "edf175f9c0a8645318ac8925adf0af6956f61425" }
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.1", git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
genet-scripted-dom = { version = "=0.1.2", git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
# No parley/fontique patch rows: as of genet 5ae30cad the forks are published as
# `genet-parley` and `genet-fontique`, so nothing in genet answers to the name
# `parley` and a row keyed on it would match no package and fail resolution.
# genet-livery reaches the fork by path inside the git checkout, and Mere's own
# `parley` workspace dep names the fork by package, so the graph keeps one copy.
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "679d8314aab4ec9f57a903c79dde244c3c565c1e" }
