[package]
name = "knot-editor"
version = "0.0.3"
edition.workspace = true

rust-version = "1.97.1"
license.workspace = true
repository.workspace = true
description = "Files-in-place local-first Djot editor, document authority, and peer sync."

# Both bins reach a peer: `knot_endpoint` takes the iroh clip-evidence store and
# mere-fetch for effect fetches, `knot_sync_host` is the resident sync host.
[[bin]]
name = "knot_endpoint"
path = "src/bin/knot_endpoint.rs"
required-features = ["peers"]

[[bin]]
name = "knot_sync_host"
path = "src/bin/knot_sync_host.rs"
required-features = ["peers"]

# Hands a completed site to the resident, which keeps serving it.
[[bin]]
name = "knot_site"
path = "src/bin/knot_site.rs"
required-features = ["site-handoff"]

# Spawns the `knot_endpoint` bin, which needs `peers`.
[[test]]
name = "revision_bell"
required-features = ["peers"]

# Both examples stand up a peer transport.
[[example]]
name = "k2_peer"
required-features = ["peers"]

[[example]]
name = "knot_publish_peer"
required-features = ["peers"]

[features]
default = []
# Search embedders beyond the lexical default. Off by default so an ordinary
# build stays on esp's serde-only tree: no burn, no tokenizers. A writer still
# has to supply the model directory; these only compile the provider in.
embed-bert = ["esp/bert"]
embed-bert-wgpu = ["embed-bert", "esp/bert-wgpu"]
# A resident mere's sessions and archive as an overmap layer above Knot's
# catalog graph (`mere_overlay`). Off by default so the library Djinn embeds
# takes no view cone unless it asks.
mere-overlay = ["dep:mere-overmap", "dep:mere-view"]
# Everything that reaches a peer or the network: the Mark QUIC read host, the
# publish carrier, client and host, `KnotSyncStore::join`, the resident sync host,
# the iroh-backed clip-evidence store (`BlobClipEvidenceStore`,
# `content_blob_store`), and the bins' mere-fetch. Off by default, so the library
# links no iroh, quinn, p2panda-net or reqwest: Knot is an offline application
# unless a consumer opts in by name (Djinn, Turnstone). `tools/check_profile.py
# library` keeps the default honest.
# The native `knot_endpoint` binary also offers a read-only directory through
# Djinn's app door. The library default remains free of native provider code.
projection-provider = ["graphshell-endpoint/projection-provider"]
# The `knot_site` client: hand a completed site to the resident on its
# published-site route (`knot_site::handoff`).
site-handoff = ["dep:knot-site"]
peers = ["dep:transport", "dep:quinn", "dep:rustls", "dep:fetch", "stickleback/net"]

[dependencies]
knot-capture.workspace = true
knot-composition.workspace = true
base64.workspace = true
blake3.workspace = true
chartulary.workspace = true
eidetic = { workspace = true, features = ["json-schema"] }
fetch = { workspace = true, optional = true }
fleece.workspace = true
# The custody client: Knot reaches its persona keys by calling djinn (dramatis
# DR-C), through the application door (Mere stack lift plan P1); no
# `graphshell` in the library.
graphshell-endpoint = { workspace = true, features = ["projection-door", "stdio"] }
djinn = { workspace = true, features = ["custody-client"] }
dramatis.workspace = true
mere-overmap = { workspace = true, optional = true, features = ["resident"] }
mere-view = { workspace = true, optional = true }
chirograph.workspace = true
inker.workspace = true
jotdown = "0.10"
knot-document = { workspace = true, features = ["engine"] }
knot-site = { path = "../knot-site", optional = true }
knot-catalog.workspace = true
muniment = { workspace = true, features = ["redb"] }
mora.workspace = true
mora-cmudict.workspace = true
# `endpoint.rs` names `nematic::HtmlFragmentEngine`, which is behind nematic's
# `html-fragment` feature. The workspace pin is `default-features = false`, so
# until the 2026-09-03 boundary repoint this compiled only because
# knot-editor-host resolved from genet.git and pulled nematic's defaults in
# through genet's own workspace table. knot-editor-host resolves from mere.git
# now, whose table names no defaults, so the feature is named where it is used.
nematic = { workspace = true, features = ["html-fragment"] }
notify = "8"
notochord = { workspace = true, features = ["tokio"] }
insigne.workspace = true
personae.workspace = true
p2panda-core = "0.7.0"
p2panda-store = { version = "0.7.0", default-features = false }
pollster = "0.4"
postcard = { version = "1", features = ["alloc"] }
proofs.workspace = true
quinn = { version = "0.11", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sceno.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "2.7"
script-rhai.workspace = true
servitor.workspace = true
pandect.workspace = true
esp.workspace = true
# Without `peers` stickleback is its local half only; `peers` turns its `net`
# feature on (the workspace row names `default-features = false`).
stickleback.workspace = true
thiserror = "1"
transport = { workspace = true, features = ["noise", "notochord"], optional = true }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# Hest declarations and invocation data in the real script-fence receiving test.
cambium.workspace = true
# The serving half the tests and `k2_peer` stand up: admission, the endpoint
# catalog, the session loop and the projection host (Mere's `graphshell-host`,
# stack lift plan P4), and the client state the tests read back with.
# Its `view` receipts (`rosette_projection`) and `sessions` (`revision_bell`)
# are `graphshell_host`'s too. The app-route receipt that ran Graphshell's
# broker moved to Djinn with the broker (P5).
graphshell-host = { workspace = true, features = ["native"] }
graphshell-client.workspace = true
scenomise.workspace = true
scenograph.workspace = true
gemot.workspace = true
graphshell-endpoint = { workspace = true, features = ["local"] }
djinn = { workspace = true, features = ["door-serve"] }
rcgen = "0.14"
taproot = { workspace = true }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
transport = { workspace = true, features = ["test-identity"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
