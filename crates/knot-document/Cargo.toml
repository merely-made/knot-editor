[workspace]
resolver = "2"

[package]
name = "knot-document"
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MPL-2.0"
repository = "https://github.com/merely-made/knot-editor"
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
cambium = { version = "0.3.3", git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4" }
mere-surface-api = { version = "0.1.0", git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4" }
illume = { version = "0.0.2", git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4", optional = true }
inker = { git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4", optional = true }
knot-editor-host = { git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4", default-features = false }
nematic = { git = "https://github.com/merely-made/mere.git", rev = "b57d2021bac2bb32febfd5b96098384a63ef58a4", default-features = false, optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
genet-scripted-dom = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
tempfile = "3"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = "warn"

[patch.crates-io]
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
layout-dom-api = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
genet-scripted-dom = { version = "=0.1.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
ipc-channel = { git = "https://github.com/merely-made/genet.git", rev = "115d348deddc344d949754e63beaece47cf49f34" }
